"/machines/:id"(id){const m=MACHINES.find(x=>x.id===id);if(!m)return err("Machine not found","Check the link or pick a machine from the list.");cur=id;const l=last(id);
 return`<h1>${m.name}</h1><div class="mu">${m.type} · ${m.loc} · ${m.ref}</div><br>${l?`<div class="grid">${metric("Status",L[l.result][1],"")}${metric("Score",f2(l.anomaly_score),"")}</div>`:""}
 <div class="pn"><h2>Health Trend</h2>${trend(id)}</div><div class="pn"><h2>Learned Normal Baseline</h2><p class="mu">This represents the acoustic behavior learned from normal operating samples. Baseline data has not been provided by the backend yet.</p></div>
 <div class="pn"><h2>Recent analyses</h2>${history.filter(h=>h.machine===id).slice(0,5).map(h=>`<div>${new Date(h.t).toLocaleString()} — ${L[h.result][1]} (${f2(h.anomaly_score)})</div>`).join("")||'<p class="mu">No analysis records yet.</p>'}</div>`},
"/history"(){if(!history.length)return`<h1>Analysis History</h1><div class="pn"><p>No analysis records yet.</p><a class="btn p" href="#/analyze" style="display:inline-flex;align-items:center;text-decoration:none">Analyze Audio</a></div>`;
 const rows=history.map(h=>`<tr><td>${new Date(h.t).toLocaleString()}</td><td>${mname(h.machine)}</td><td><span class="pill ${L[h.result][0]}">${L[h.result][1]}</span></td><td>${f2(h.anomaly_score)}</td><td>${h.signal_quality}</td></tr>`).join("");
 return`<h1>Analysis History</h1><br><div class="pn"><table><thead><tr><th>Time<th>Machine<th>Result<th>Score<th>Signal</tr></thead><tbody>${rows}</tbody></table>
 <div class="cards">${history.map(h=>`<div class="pn"><b>${mname(h.machine)}</b> <span class="pill ${L[h.result][0]}">${L[h.result][1]}</span><div class="mu">${new Date(h.t).toLocaleString()}</div>Score ${f2(h.anomaly_score)}</div>`).join("")}</div></div>`},
"/alerts"(){return`<h1>Alerts</h1><br>${alerts.length?alerts.map(a=>`<div class="pn" style="border-left:8px solid var(--bad)"><b class="bad">! ANOMALY DETECTED</b> <span class="pill bad">${a.sev}</span><br>${mname(a.machine)} · ${new Date(a.t).toLocaleString()}<br>Score ${f2(a.score)} / threshold ${f2(a.th)} · Further inspection recommended.<div class="row" style="margin-top:8px"><a class="btn" href="#/history" style="display:inline-flex;align-items:center;text-decoration:none">View Analysis</a><button class="btn" data-r="${a.id}">${a.status==="active"?"Mark resolved":"Resolved"}</button></div></div>`).join(""):`<div class="pn"><p><b>No active alerts.</b><br>All monitored machines are currently operating within their configured acoustic thresholds.</p></div>`}`}};
const err=(a,b)=>`<div class="err" role="alert"><b>${a}</b><br>${b}<br><br><button class="btn" onclick="route()">Try Again</button></div>`;
/* ===== pipeline ===== */
const STAGES=["Uploading audio","Validating signal","Preprocessing audio","Generating Mel Spectrogram","Running Autoencoder","Calculating anomaly score","Comparing threshold","Generating result"];
function showStages(el,n,fail){el.innerHTML=`<div class="pn" aria-live="polite"><h2>AI analysis pipeline</h2>${STAGES.map((s,i)=>`<div class="stage ${fail===i?"":i<n?"done":i===n?"run":"pend"}"><i>${fail===i?"✕":i<n?"✓":i===n?"●":"○"}</i>${s}</div>`).join("")}</div>`}
async function runAnalysis(file,sample){const pipe=$("#pipe"),out=$("#out");out.innerHTML="";let n=0;
 if(!DEMO&&!file){pipe.innerHTML=err("No audio selected","Choose a WAV, MP3 or FLAC file, then try again.");return}
 if(file){const ok=/\.(wav|mp3|flac)$/i.test(file.name);if(!ok||file.size>50e6){pipe.innerHTML=err("Unsupported file","Use a WAV, MP3 or FLAC file under 50 MB.");return}}
 const tick=setInterval(()=>{if(n<STAGES.length-1)showStages(pipe,++n)},450);showStages(pipe,0);
 try{const[r]=await Promise.all([api.analyze(file,cur,sample),new Promise(r=>setTimeout(r,DEMO?3700:0))]);clearInterval(tick);showStages(pipe,STAGES.length);
  if(file&&r.spectrogram==null){try{r.spectrogram=await melSpec(file)}catch(e){r.spectrogram=null}}
  if(r.spectrogram==null&&r.demo&&!file){r.spectrogram=Array.from({length:48},(_,j)=>Array.from({length:96},(_,i)=>{const b=Math.exp(-j/14)*.8,e=r.result==="ANOMALY"&&i>50&&i<70?.6*Math.exp(-Math.abs(j-20)/9):0;return Math.min(1,b+e+.08*Math.sin(i*.4+j*r.seed))}))}
  const rec=save(r,cur);out.innerHTML=resultPanel(r,cur)+(r.result==="ANOMALY"?`<div class="pn"><b>Alert created.</b> <a href="#/alerts">Open alert</a></div>`:"");drawSpec(r);return r}
 catch(e){clearInterval(tick);showStages(pipe,n,n);pipe.insertAdjacentHTML("beforeend",err("Audio analysis could not be completed.",(e.message||"Network error")+" Check that the service is reachable and the file is valid."))}}
/* ===== router ===== */
function route(){stopLive();const h=(location.hash||"#/").slice(1),v=$("#v");let fn,arg;
 if(h.startsWith("/machines/")){fn=V["/machines/:id"];arg=h.split("/")[2]}else fn=V[h]||V["/"];
 document.querySelectorAll("nav a").forEach(a=>a.removeAttribute("aria-current"));
 const act=[...document.querySelectorAll("nav a")].find(a=>a.getAttribute("href")==="#"+(h.startsWith("/machines")?"/machines":V[h]?h:"/"));act&&act.setAttribute("aria-current","page");
 v.innerHTML=fn(arg);v.focus&&window.scrollTo(0,0);bind(h)}
function bind(h){const ms=$("#ms");ms&&ms.addEventListener("change",e=>{cur=e.target.value;store.set("ano_m",cur);route()});
 const go=$("#go");go&&go.addEventListener("click",async()=>{const st=$("#state");await startLive($("#cv"),$("#src"),cur);if(st)st.innerHTML='<div class="big wn">LISTENING</div><p>Listening for machine sound...</p>'});
 const stop=$("#stop");stop&&stop.addEventListener("click",()=>{stopLive();$("#src").textContent="Input idle";const st=$("#state");if(st)st.innerHTML='<div class="big mu">IDLE</div><p>Ready to monitor</p>'});
 const an=$("#an");an&&an.addEventListener("click",async()=>{const st=$("#state");if(!live){st.innerHTML='<div class="big wn">IDLE</div><p>Start monitoring before analyzing a sample.</p>';return}
  st.innerHTML='<div class="big wn">ANALYZING</div><p>Analyzing acoustic pattern...</p>';await new Promise(r=>setTimeout(r,900));
  /* live capture upload to /analyze is wired when ANO_API_BASE is set; demo mode analyzes the labelled normal sample */
  const r=await api.analyze(null,cur,"normal");save(r,cur);const[c,b,t]=L[r.result];st.innerHTML=`<div class="big ${c}">${b}</div><p>${t}</p>`;$("#out").innerHTML=`<div class="grid">${metric("Anomaly score",f2(r.anomaly_score),r.demo?"Demo sample":"")}${metric("Threshold",f2(r.threshold),"")}</div>`});
 const alo=$("#alo");alo&&alo.addEventListener("click",()=>sb.auth.signOut());
 const apw=$("#apw");apw&&apw.addEventListener("click",async()=>{const p=$("#np").value,st=$("#ast");if(p.length<6){st.textContent="Password must be at least 6 characters.";return}
  const{error}=await sb.auth.updateUser({password:p});$("#np").value="";st.textContent=error?error.message:"Password updated."});
 const f=$("#f");f&&f.addEventListener("change",()=>{const x=f.files[0];$("#fi").textContent=x?x.name+" · "+(x.size/1048576).toFixed(1)+" MB":""});
 const run=$("#run");run&&run.addEventListener("click",()=>runAnalysis(f.files[0],"normal"));
 document.querySelectorAll("[data-s]").forEach(b=>b.addEventListener("click",()=>runAnalysis(null,b.dataset.s)));
 document.querySelectorAll("[data-r]").forEach(b=>b.addEventListener("click",()=>{const a=alerts.find(x=>x.id==b.dataset.r);a.status="resolved";store.set("ano_alerts",alerts);b.textContent="Resolved"}))}
addEventListener("hashchange",()=>{session&&route()});boot();
</script></body></html>
